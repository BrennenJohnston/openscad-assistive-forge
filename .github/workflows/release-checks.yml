name: Release Checks

# The slow browser lanes and the Lighthouse audit. They run on every push to
# develop (each merge), every night, and by hand; a pull request runs the Test
# Suite workflow only. The check names here are the ones the main ruleset
# requires, and only the push run counts toward them: a run started by hand
# does not appear among a commit's checks.

on:
  schedule:
    - cron: '0 9 * * *'
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # Edge E2E tests - Tier 1 browser.
  #
  # The suite runs as four shards side by side, each with the whole ceiling
  # below, so a shard that comes close to the ceiling calls for another
  # shard rather than a bigger ceiling. The summary job after this one gives
  # the lane a single check name, whatever the shard count.
  #
  # Each shard's playwright-results.json holds only that shard's tests, each
  # carrying a result, so the never-started guard below works per shard.
  # There are no serial-mode describes in tests/e2e, so nothing depends on
  # two cases landing on the same machine.
  e2e-tests-edge:
    name: E2E Tests (Edge ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # The City Walk e2e suites are paused on CI (the skip in
    # tests/e2e/helpers/city-walk.js says why), and the rest of the suite
    # fits 45 minutes with room.
    timeout-minutes: 45

    strategy:
      # A red shard must not cancel its sibling: knowing whether the failure
      # is in one half or both is most of the diagnosis.
      fail-fast: false
      matrix:
        # Four: the cost model put two Edge shards at 43.7 projected
        # minutes, past any honest ceiling, and three at 34.9 of 35 once the
        # suite grew again.
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A scheduled run starts on the default branch; the lanes measure develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm
      
      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-msedge-ffmpeg-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (Edge/msedge)
        # The msedge channel is an apt download, which the cache above
        # cannot hold - but the runner image ships Microsoft Edge already, so
        # only download when it is genuinely missing. ffmpeg (video recording)
        # comes from the cached ms-playwright directory.
        run: |
          if command -v microsoft-edge >/dev/null 2>&1; then
            echo "Microsoft Edge is preinstalled on this runner; skipping the download"
          else
            npx playwright install --with-deps msedge
          fi
          npx playwright install ffmpeg
      
      - name: Run E2E tests (Edge shard ${{ matrix.shard }} of 4)
        # scripts/e2e-shard.mjs divides the files, as on Chromium and for the
        # same reason: Playwright's own --shard follows the alphabet, which
        # left this lane lopsided (32m32s against 15m14s on one green board).
        # Its weights are Chromium seconds - Edge is slower across the board,
        # but the packing works off the ratios between files, and those are a
        # property of what the tests do rather than of the browser.
        run: |
          FILES=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 4 msedge)
          echo "shard ${{ matrix.shard }}/4 runs: $FILES"
          npx playwright test --project=msedge $FILES
        env:
          # Playwright's whole-run clock: 40 minutes, inside the 45-minute
          # job. A run that hits it ends in "Timed out waiting ...s" with
          # tests never started rather than on an assertion, and the guard
          # step below fails the shard when that happens. Edge's real seconds
          # run above the cost model's Chromium seconds on this runner (three
          # shards once measured 36 minutes each against a 35-minute clock),
          # so 40 keeps a margin over that. If a shard comes close again, add
          # a shard rather than raise this.
          PW_GLOBAL_TIMEOUT: '2400000'

      # A green summary over an incomplete run must fail, so every shard
      # checks its own report for tests that never started.
      - name: Never-started tests fail this shard
        run: node scripts/check-e2e-complete.mjs playwright-results.json

      - name: Upload Playwright report (Edge shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-edge-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # One required name for the Edge lane, whatever the shard count. `if:
  # always()` so a failed shard still reaches this job and turns it red.
  e2e-tests-edge-summary:
    name: E2E Tests (Edge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e-tests-edge]
    if: always()
    steps:
      - name: Every Edge shard must have passed
        run: |
          result='${{ needs.e2e-tests-edge.result }}'
          echo "Edge shards reported: $result"
          test "$result" = success

  # Firefox E2E tests - blocking (stabilized in v4.3.0 via parallel workers + timeouts)
  #
  # Sharded because one 35-minute budget for the whole suite was outgrown:
  # run after run, including on a fresh runner (so capacity rather than one
  # unlucky machine), the lane ended in "Timed out waiting 2100s for the test
  # suite to run" with 588-589 passed, none failed, and up to 15 tests never
  # started. The never-started guard caught it, as it exists to; the budget
  # was the problem.
  #
  # The division comes from scripts/e2e-shard.mjs, exactly as the Chromium and
  # Edge lanes do it: Playwright's own --shard divides by test count in path
  # order, which balances the counts and not the work.
  e2e-tests-firefox-shard:
    # Four shards: at two, the lane projected to 49.4 minutes against the
    # 35-minute ceiling, and at three to 34.8 once the suite grew again. The
    # per-shard job names are not check names anything requires (the summary
    # job below carries the lane's name), so the shard count can change
    # without a ruleset edit.
    name: E2E Tests (Firefox ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # A red shard must not cancel its siblings: knowing which shard holds
      # the failure is most of the diagnosis.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A scheduled run starts on the default branch; the lanes measure develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Cache Liberation fonts
        uses: actions/cache@v4
        with:
          path: public/fonts/*.ttf
          key: liberation-fonts-${{ hashFiles('scripts/download-wasm.js') }}
      
      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm
      
      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (Firefox)
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install firefox
          else
            npx playwright install --with-deps firefox
          fi
      
      - name: Run E2E tests (Firefox shard ${{ matrix.shard }} of 4)
        run: |
          # The shard count is said once, in the matrix above, and repeated
          # here; the project name makes the planner book only what this
          # lane will actually run (PROJECT_IGNORES).
          FILES=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 4 firefox)
          echo "shard ${{ matrix.shard }}/4 runs: $FILES"
          npx playwright test --project=firefox $FILES
        env:
          # Playwright's whole-run clock: 35 minutes per shard. Under the
          # default 10 minutes, 86 tests had never started here, so the job's
          # signal was noise. The never-started guard fails the job if the
          # clock ever cuts a run short; if a shard comes close, add a shard
          # rather than raise this.
          PW_GLOBAL_TIMEOUT: '2100000'

      # This lane can genuinely fail, so the never-started guard has teeth on
      # it. WebKit is deliberately left without one - it carries
      # continue-on-error by design (issue #36), so a guard there could never
      # turn the board red anyway.
      - name: Never-started tests fail this job
        run: node scripts/check-e2e-complete.mjs playwright-results.json

      - name: Upload Playwright report (Firefox)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Each shard writes its own report, so the artifact name says which.
          name: playwright-report-firefox-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # One name for the Firefox lane, whatever the shard count. `needs` on a
  # matrix job is `success` only when every leg succeeded, and `if: always()`
  # means a failed shard turns this red rather than skipping it.
  e2e-tests-firefox:
    name: E2E Tests (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e-tests-firefox-shard]
    if: always()

    steps:
      - name: All Firefox shards must have passed
        run: |
          result='${{ needs.e2e-tests-firefox-shard.result }}'
          echo "Firefox shards reported: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Firefox did not pass ($result). The shard that failed is one of E2E Tests (Firefox 1/4) to (4/4)."
            exit 1
          fi

  # Safari/WebKit E2E tests - requires macOS runner for WebKit.
  #
  # continue-on-error is intentional (see issue #36): WebKit on macOS runners
  # has historically flaky skip-link, modal focus, and theme keyboard tests,
  # so this job is non-blocking: the workflow stays green while WebKit
  # regressions still show in the job logs and artifacts. A run with this job
  # red and everything else green concludes the workflow as success.
  #
  # The scope of this lane lives in playwright.config.js, not here: the whole
  # suite needs roughly 100+ minutes on a runner billed at 10x, so the lane is
  # scoped and weighted toward accessibility (Safari is where VoiceOver users
  # are). Read the project comment in playwright.config.js before changing
  # the list or this timeout.
  e2e-tests-webkit:
    name: E2E Tests (Safari/WebKit)
    runs-on: macos-latest
    timeout-minutes: 45
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A scheduled run starts on the default branch; the lanes measure develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Cache Liberation fonts
        uses: actions/cache@v4
        with:
          path: public/fonts/*.ttf
          key: liberation-fonts-${{ hashFiles('scripts/download-wasm.js') }}
      
      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm
      
      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ms-playwright
          key: pw-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (WebKit)
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install webkit
          else
            npx playwright install --with-deps webkit
          fi
      
      - name: Run E2E tests (WebKit)
        run: npx playwright test --project=webkit
        env:
          # Playwright's whole-run clock: 35 minutes. Even scoped to 176
          # tests, 25 minutes was once the clock rather than the browser: 35
          # tests never started, because four tests (no WASM after a reload,
          # now skipped at source) each waited out a 180 s timeout three
          # times. macOS runners bill at 10x, so the ceiling is insurance
          # against an unfinished lane rather than time this job is expected
          # to use.
          PW_GLOBAL_TIMEOUT: '2100000'
      
      - name: Upload Playwright report (WebKit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-webkit
          path: playwright-report/
          retention-days: 30

  # This job used to be vacuous twice over. tests/visual/baselines/linux/
  # held nothing but .gitkeep, so the generate-on-first-run branch below
  # fired on every run: it made fresh baselines, compared them against
  # nothing, and passed. And it carried continue-on-error, so even a real
  # failure could not have shown.
  #
  # A real Linux baseline set, captured on this runner and looked at image by
  # image, is now committed, so the comparison branch is the one that runs.
  # The continue-on-error is gone: this job can fail, honestly. It is not a
  # required check, so a red here reports a visual change without blocking a
  # merge, and no required lane carries continue-on-error.
  #
  # The generate branch is kept, because bootstrapping a new platform needs it,
  # but it now fails the job afterwards. A run that generated baselines
  # compared nothing, and must never again be able to report that as green.
  visual-regression:
    name: Visual Regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A scheduled run starts on the default branch; the lanes measure develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm
      
      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers (Chromium)
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      
      - name: Check for existing baselines
        id: check-baselines
        run: |
          BASELINE_COUNT=$(find tests/visual/baselines/linux -name '*.png' 2>/dev/null | wc -l)
          echo "baseline_count=$BASELINE_COUNT" >> "$GITHUB_OUTPUT"
          if [ "$BASELINE_COUNT" -eq 0 ]; then
            echo "No Linux baselines found — will generate them."
          else
            echo "Found $BASELINE_COUNT existing baselines."
          fi
      
      - name: Generate baselines (first run)
        if: steps.check-baselines.outputs.baseline_count == '0'
        run: npx playwright test --project=visual-regression --update-snapshots
      
      - name: Run visual regression tests
        if: steps.check-baselines.outputs.baseline_count != '0'
        run: npx playwright test --project=visual-regression
      
      - name: Upload generated baselines
        if: steps.check-baselines.outputs.baseline_count == '0'
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: tests/visual/baselines/linux/
          retention-days: 30

      # A run that generated baselines compared nothing. That is how this
      # job passed every run for its whole life. The artifact above is the
      # useful part - download it, look at every image, commit the ones that
      # are right - but the run itself must not report green.
      - name: A generating run has not checked anything
        if: steps.check-baselines.outputs.baseline_count == '0'
        run: |
          echo "This run found no Linux baselines and generated them instead of"
          echo "comparing against them, so it verified nothing."
          echo "Download the visual-baselines-linux artifact, LOOK at every"
          echo "image, and commit the ones that show what their name says."
          exit 1
      
      - name: Upload visual diff artifacts
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-diff
          path: test-results/
          retention-days: 14

  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A scheduled run starts on the default branch; the lanes measure develop.
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
      
      - name: Format Lighthouse Score
        id: lighthouse_score
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('.lighthouseci/lhr-*.json', 'utf8'));
            const categories = results.categories;
            
            const scores = {
              performance: Math.round(categories.performance.score * 100),
              accessibility: Math.round(categories.accessibility.score * 100),
              bestPractices: Math.round(categories['best-practices'].score * 100),
              seo: Math.round(categories.seo.score * 100),
            };
            
            console.log('Lighthouse Scores:');
            console.log(`  Performance: ${scores.performance}`);
            console.log(`  Accessibility: ${scores.accessibility}`);
            console.log(`  Best Practices: ${scores.bestPractices}`);
            console.log(`  SEO: ${scores.seo}`);
            
            // Fail if performance is below threshold
            if (scores.performance < 70) {
              core.setFailed(`Performance score ${scores.performance} is below threshold of 70`);
            }
            
            return scores;
        continue-on-error: true
      
      - name: Comment PR with Lighthouse Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the lighthouse result file
            const lhciDir = '.lighthouseci';
            const files = fs.readdirSync(lhciDir);
            const lhrFile = files.find(f => f.startsWith('lhr-') && f.endsWith('.json'));
            
            if (!lhrFile) {
              console.log('No Lighthouse results found');
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(path.join(lhciDir, lhrFile), 'utf8'));
            const categories = results.categories;
            
            const getEmoji = (score) => {
              if (score >= 90) return '🟢';
              if (score >= 50) return '🟡';
              return '🔴';
            };
            
            const scores = {
              performance: Math.round(categories.performance.score * 100),
              accessibility: Math.round(categories.accessibility.score * 100),
              bestPractices: Math.round(categories['best-practices'].score * 100),
              seo: Math.round(categories.seo.score * 100),
            };
            
            const body = `## 🔦 Lighthouse Report
            
            | Category | Score |
            |----------|-------|
            | ${getEmoji(scores.performance)} Performance | ${scores.performance} |
            | ${getEmoji(scores.accessibility)} Accessibility | ${scores.accessibility} |
            | ${getEmoji(scores.bestPractices)} Best Practices | ${scores.bestPractices} |
            | ${getEmoji(scores.seo)} SEO | ${scores.seo} |
            
            <details>
            <summary>Performance Metrics</summary>
            
            | Metric | Value |
            |--------|-------|
            | First Contentful Paint | ${results.audits['first-contentful-paint'].displayValue} |
            | Largest Contentful Paint | ${results.audits['largest-contentful-paint'].displayValue} |
            | Total Blocking Time | ${results.audits['total-blocking-time'].displayValue} |
            | Cumulative Layout Shift | ${results.audits['cumulative-layout-shift'].displayValue} |
            | Speed Index | ${results.audits['speed-index'].displayValue} |
            
            </details>
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
        continue-on-error: true
