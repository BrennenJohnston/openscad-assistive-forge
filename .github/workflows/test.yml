name: Test Suite

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Check for hallucinated imports
        run: npm run import-check

      - name: Audit CSS variables
        run: npm run css-variable-audit

      - name: Validate HTML (vnu)
        run: npm run validate:html

      - name: Run unit tests
        run: npm run test:run
      
      - name: Generate coverage report
        run: npm run test:coverage
      
      - name: Archive coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  # WASM smoke gate - blocking. The one e2e job with zero test.skip(isCI):
  # boot + WASM init, upload, preview render, full-render STL bytes, and
  # param-change re-render all run for real. If this job is red, the core
  # pipeline is broken no matter what the other (heavily skipped) jobs say.
  wasm-smoke:
    name: WASM Smoke (blocking, no skips)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm

      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run WASM smoke suite
        run: npx playwright test tests/e2e/wasm-smoke.spec.js --project=chromium
        env:
          # Real WASM renders with retries need more than the default
          # 10-minute global ceiling.
          PW_GLOBAL_TIMEOUT: '900000'

      - name: Upload Playwright report (WASM smoke)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-wasm-smoke
          path: playwright-report/
          retention-days: 30

  # Geometry parity gate - blocking. Renders the CI parity fixtures in
  # headless Chromium via the app's own pipeline and compares against the
  # committed golden manifest (scripts/parity/golden/) with hash-exact
  # tolerance. Any change that alters exported geometry bytes fails here.
  parity-check:
    name: Geometry Parity (golden, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm

      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Start dev server
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5173 >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:5173 >/dev/null

      - name: Run golden parity comparison
        run: npm run parity:ci

      - name: Upload parity report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parity-report
          path: artifacts/parity/report.*
          retention-days: 30

  # Chromium runs as six shards side by side, each with the whole ceiling
  # below; a shard that comes close to it calls for another shard rather
  # than a bigger ceiling. The shards get their own check names, and the
  # small summary job below keeps the one name the rulesets require, "E2E
  # Tests (Chromium)", so the shard count can change without a ruleset edit.
  # The cost is one extra ~15s job.
  #
  # Each shard's playwright-results.json holds only that shard's tests, each
  # carrying a result, so the never-started guard works per shard rather
  # than seeing the other shards' tests as missing.
  e2e-tests-chromium-shard:
    name: E2E Tests (Chromium ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # The City Walk e2e suites are paused on CI (the skip in
    # tests/e2e/helpers/city-walk.js says why), and the rest of the suite
    # fits 45 minutes with room.
    timeout-minutes: 45

    strategy:
      # A red shard must not cancel its siblings: knowing which shard holds
      # the failure is most of the diagnosis.
      fail-fast: false
      matrix:
        # Six, measured rather than modelled: four shards still hit the
        # 2100 s clock, because two workers on a two-core runner with
        # software 3D rendering deliver nowhere near 2x parallelism on the
        # heaviest files.
        shard: [1, 2, 3, 4, 5, 6]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm
      
      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi
      
      - name: Run E2E tests (Chromium shard ${{ matrix.shard }} of 6)
        # The division comes from scripts/e2e-shard.mjs, not from
        # Playwright's --shard. --shard divides by test count in path order,
        # which balanced the counts (476 / 475) and not the work (50.3 / 20.9
        # test-minutes), because the expensive files all sort early. The
        # script reads tests/e2e itself, so a new spec cannot fall between the
        # shards; its header says how to re-measure the weights.
        run: |
          FILES=$(node scripts/e2e-shard.mjs ${{ matrix.shard }} 6)
          echo "shard ${{ matrix.shard }}/6 runs: $FILES"
          npx playwright test --project=chromium $FILES
        env:
          # Playwright's whole-run clock: 35 minutes per shard. Under the
          # default 10 minutes a run ended in "Timed out waiting 600s" with
          # tests never started, not on any assertion. A red that means the
          # clock rather than a defect is how a broken editor once shipped
          # behind a green suite. The guard step below fails the shard if the
          # clock ever cuts a run short; if a shard comes close, add a shard
          # rather than raise this.
          PW_GLOBAL_TIMEOUT: '2100000'

      # This job once stayed green for a whole release while two
      # menu-parity tests were red, because tests the clock cut off report as
      # never-started rather than failed. A green summary over an incomplete
      # run must fail.
      - name: Never-started tests fail this shard
        run: node scripts/check-e2e-complete.mjs playwright-results.json

      - name: Upload Playwright report (Chromium shard ${{ matrix.shard }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # upload-artifact v4 rejects two uploads under one name, so the
          # shard number has to be in it.
          name: playwright-report-chromium-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

  # The required check. Both rulesets require "E2E Tests (Chromium)", so that
  # name has to keep existing and keep meaning "the whole Chromium suite
  # passed".
  #
  # `needs` on a matrix job resolves to a single result that is `success` only
  # when every leg succeeded, so this is a real gate rather than a rubber stamp.
  # `if: always()` matters as much: without it a failed shard would skip this
  # job, and a skipped required check is not the same thing as a failed one -
  # it would leave the merge waiting rather than refused.
  e2e-tests-chromium:
    name: E2E Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e-tests-chromium-shard]
    if: always()

    steps:
      - name: Every Chromium shard must have passed
        run: |
          result='${{ needs.e2e-tests-chromium-shard.result }}'
          echo "Chromium shards reported: $result"
          if [ "$result" != "success" ]; then
            echo "::error::Chromium did not pass ($result). The shard that failed is one of E2E Tests (Chromium 1/6) to (6/6)."
            exit 1
          fi

  # Production-parity E2E lane. Every other e2e job above runs against the Vite
  # dev server, which sends no Content-Security-Policy; the built app behind the
  # shipped public/_headers CSP had never been loaded by any test, and that is
  # the gap a broken editor once walked through to production.
  #
  # Deliberately its own job rather than a step on Build Check: a failure here
  # is a test failure, and reporting it as a build failure would send whoever
  # reads the check name looking in the wrong place.
  e2e-tests-production:
    name: E2E Tests (Production CSP)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download OpenSCAD WASM files
        run: npm run setup-wasm

      # The browser download hung twelve CI jobs in two days (four at
      # once on one run). Cache the browsers so the install step only ever
      # downloads when the Playwright version moves.
      - name: Cache Playwright browsers
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        # On a cache hit the browsers are already here, and --with-deps'
        # apt-get against the Azure mirror is the thing that actually hangs
        # (measured: the hang survived a cache hit). The runner image already
        # ships every system library these browsers need.
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Build project
        run: npm run build

      - name: Run production-parity E2E tests
        run: npx playwright test --config=playwright.prod.config.js

      # This lane writes a whole-window screenshot of the built app every run,
      # pass or fail — that artifact is half the point of it. The prod config
      # reports to the console in CI and writes no HTML report, so uploading
      # playwright-report/ here would archive an empty directory.
      - name: Upload production artifacts (screenshots, traces, video)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-smoke-artifacts
          path: test-results/
          retention-days: 30

  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build

      - name: Validate built HTML (vnu)
        run: npm run validate:html:built

      - name: Check bundle size (raw)
        run: |
          echo "Checking dist/ directory size..."
          du -sh dist/
          du -h dist/ | sort -h | tail -20
      
      - name: Check bundle budget
        run: node scripts/check-bundle-budget.js dist
      
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Security checks - blocking.
  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run npm audit (block on critical/high)
        run: |
          npm audit --audit-level=high
        continue-on-error: false
      
      - name: Generate SBOM (CycloneDX format)
        run: |
          npx @cyclonedx/cyclonedx-npm --output-file sbom-generated.json
      
      - name: Verify lockfile integrity
        run: |
          # npm ci already validates lockfile integrity
          # This step documents the check and provides explicit feedback
          echo "Lockfile integrity verified by npm ci"
      
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom-generated.json
          retention-days: 90

  # Docs link check: three dead links once survived years of green boards.
  # Not required by design - a flaky external site must never block a merge -
  # and no continue-on-error: when it is red, it is honestly red.
  #
  # Scope, declared: the living documentation listed below. The records trees
  # (docs/archive, the VPAT evidence) are point-in-time documents and stay
  # out. 403 is accepted because every one the first sweep found was a
  # bot-wall on a live site (w3.org's WCAG page included); the hosts that
  # reject CI outright are excluded by name. One of them is the OSM
  # Foundation's operations site, which refused the runners two runs in a
  # row, first as a 20-second timeout and then as a connection reset, on the
  # single link to its Nominatim usage policy. That page answers 200 from an
  # ordinary connection - measured at 12.7 seconds - so the link is good and
  # the host is the problem. Excluding it costs exactly one link; nothing else
  # in the checked docs points at that host.
  link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check documentation links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-retries 2
            --timeout 20
            --accept 200..=204,403,429
            --exclude '^https?://(localhost|127\.0\.0\.1)'
            --exclude '^https://www\.bestbuy\.com'
            --exclude '^https://www\.sovol\.tech'
            --exclude '^https://operations\.osmfoundation\.org'
            --exclude '^https://www\.ski\.org'
            'README.md'
            'docs/README.md'
            'docs/guides/**/*.md'
            'docs/developing/*.md'
            'docs/deploying/*.md'
            'docs/accessibility/*.md'
            'docs/reference/*.md'
            'docs/project/*.md'
            'docs/notes/alt-view/*.md'
            'docs/specs/FORGE_HANDOFF_CONTRACT.md'
          fail: true

  mermaid-check:
    name: Mermaid Diagrams
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the parser
        run: npx playwright install --with-deps chromium

      # Every ```mermaid fence in the tracked Markdown, parsed by Mermaid
      # itself, the parser GitHub renders with. A diagram it rejects shows a
      # red "Unable to render rich display" box on GitHub in place of the
      # picture, and nothing else in CI reads the fences: two such diagrams
      # sat in the architecture page through every green board until a
      # reader saw them. Not required by design, like the link check: the
      # parser is loaded from a CDN, and a CDN outage must never block a
      # merge. When it is red, it is honestly red.
      - name: Parse every Mermaid diagram
        run: npm run check-mermaid

  # A required check must be capable of failing. This job once carried
  # continue-on-error on its only real step, so "Lint Markdown" reported
  # success no matter what markdownlint found. Passing `globs` here does not
  # discard the ignore list in .markdownlint-cli2.jsonc: cli2 appends the
  # config's ignores to the command-line globs, so node_modules and the
  # vendored folders stay out either way.
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: '**/*.md'

  # Tile validator - additive, and not a required check. It runs
  # scripts/validate-example.mjs over the example folders a PR actually
  # touched, so a contributed tile is checked before a human reads it.
  #
  # Deliberately not required: a check that starts out required is a check
  # nobody can ever adjust.
  validate-examples:
    name: Validate Examples (changed)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need enough history to diff against the base branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the example folders this change touches
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags --depth=50 origin "$BASE_REF"
            RANGE="origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE_SHA...HEAD"
          else
            RANGE=""
          fi

          CHANGED=""
          if [ -n "$RANGE" ]; then
            CHANGED=$(git diff --name-only "$RANGE" -- 'public/examples/**' || true)
          fi

          # The template is checked on every run whatever changed: it is the
          # file every new tile is copied from, and a broken template teaches
          # the break to everyone who copies it.
          FOLDERS="public/examples/_template"
          for file in $CHANGED; do
            dir=$(echo "$file" | cut -d/ -f1-3)
            if [ -f "$dir/manifest.json" ]; then
              FOLDERS="$FOLDERS $dir"
            fi
          done
          FOLDERS=$(echo "$FOLDERS" | tr ' ' '\n' | sort -u | tr '\n' ' ')

          echo "Checking: $FOLDERS"
          node scripts/validate-example.mjs $FOLDERS
